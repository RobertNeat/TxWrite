services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /data
      CACHE_DIR: /cache
      # Frozen dated snapshot, not the rolling tlnet mirror (see
      # docs/project_assumptons/architecture.md section 6.6). Verified reachable
      # 2026-11-01. Must match the TEX_REPO_URL build ARG passed to install-tl.
      TEX_REPO_URL: https://texlive.info/tlnet-archive/2026/10/01/tlnet/
      PREFETCH_DELAY_MS: 4000
      COMPILE_TIMEOUT_MS: 60000
      NETWORK_FETCH: "true"
    volumes:
      - data:/data
      - cache:/cache

volumes:
  data:
  cache:
