packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
# Supply-chain hardening (flagged by semgrep's pnpm ruleset, .github/pipeline_docs):
# reject transitive deps from non-registry sources, require published packages to
# age 7 days before install, and never let a lockfile downgrade these settings.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
