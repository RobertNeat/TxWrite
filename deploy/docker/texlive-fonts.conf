<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Makes TeX Live's bundled OpenType/TrueType fonts (Latin Modern, TeX Gyre, etc.)
     visible to XeTeX via fontspec. LuaTeX's luaotfload does not use fontconfig at
     all (see docs/project_assumptons/architecture.md section 7) and needs its own
     `luaotfload-tool -u` refresh instead, done at container start. -->
<fontconfig>
  <dir>/opt/texlive/texmf-dist/fonts/opentype</dir>
  <dir>/opt/texlive/texmf-dist/fonts/truetype</dir>
</fontconfig>
